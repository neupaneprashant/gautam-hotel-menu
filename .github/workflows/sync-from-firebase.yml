name: Sync menu from Firebase

# Copies the live menu from Firebase into menu-data.js and index.html so search
# engines (which read the page's built-in copy) see current prices.
on:
  schedule:
    - cron: "17,47 * * * *"     # about every 30 minutes
  workflow_dispatch: {}          # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-menu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: sync
        run: node tools/sync-from-firebase.js
      - name: Commit and publish
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "menu-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-data.js index.html
          git commit -m "Sync menu from Firebase"
          git push
          # pushes made by this workflow don't always start a Pages build, so request one
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
